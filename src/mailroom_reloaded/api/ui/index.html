<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mailroom · runs</title>
  <link rel="icon" href="data:," />
  <!-- Same typeface and tokens as /tui, then this page's layout. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/tui/assets/tokens.css" />
  <link rel="stylesheet" href="/ui/assets/ui.css" />
</head>
<body>
  <header class="status-bar">
    <div class="status-group">
      <span class="status-item essential"><span class="dot" aria-hidden="true"></span><span>mailroom@runs</span></span>
      <span class="status-item essential"><a class="sister-link" href="/tui">tui ↗</a></span>
      <span class="status-item"><a class="sister-link" id="phoenixLink" href="http://localhost:6006" target="_blank" rel="noopener noreferrer">phoenix ↗</a></span>
      <span class="status-item"><a class="sister-link" id="grafanaLink" href="http://localhost:3000" target="_blank" rel="noopener noreferrer">grafana ↗</a></span>
    </div>
    <div class="status-group">
      <input id="token" type="password" placeholder="api token (if set)" autocomplete="off" aria-label="API token" />
      <button id="refresh">refresh</button>
    </div>
  </header>

  <main>
    <noscript><p class="hint">this page needs javascript; the <a href="/tui">terminal</a> and the <a href="/v1/documents">/v1 API</a> work without it.</p></noscript>

    <section class="span-2">
      <h2>Documents</h2>
      <div class="row">
        <label class="hint" for="statusFilter">status</label>
        <select id="statusFilter">
          <option value="">all</option>
          <option>processing</option>
          <option>parked</option>
          <option>archived</option>
          <option>failed</option>
        </select>
      </div>
      <table id="documents">
        <thead><tr><th>doc_id</th><th>filename</th><th>type</th><th>status</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Review queue</h2>
      <table id="review">
        <thead><tr><th>doc_id</th><th>filename</th><th>type</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="span-2">
      <h2>Eval runs</h2>
      <table id="runs">
        <thead><tr><th>run_id</th><th>documents</th><th>replay</th><th>grafana</th><th>phoenix</th></tr></thead>
        <tbody></tbody>
      </table>
      <h2>Cards</h2>
      <pre id="cards" class="muted">run not selected</pre>
    </section>

    <section>
      <h2>Document detail</h2>
      <pre id="detail" class="muted">no document selected</pre>
    </section>

    <section>
      <h2>Audit verify</h2>
      <p class="hint" id="auditHint">click a document row, or enter a doc_id.</p>
      <div class="row">
        <input id="auditDocId" placeholder="doc_id" aria-label="doc_id to verify" />
        <button id="auditGo">verify</button>
      </div>
      <div id="auditResult" class="muted">—</div>
    </section>
  </main>

<script type="module">
import { auditSummary, mergeLinks, runLinks, statusPill } from '/ui/assets/app.js';

const $ = (id) => document.getElementById(id);

// Observability base URLs. The static defaults match the header's initial
// hrefs; loadLinks() replaces them from the public GET /links.
const DEFAULT_LINKS = {
  public_url: 'http://localhost:8000',
  phoenix_url: 'http://localhost:6006',
  grafana_url: 'http://localhost:3000',
  phoenix_project: 'mailroom-live',
};
let LINKS = { ...DEFAULT_LINKS };

async function loadLinks() {
  try {
    const res = await fetch('/links', { headers: { Accept: 'application/json' } });
    if (!res.ok) return;
    // mergeLinks drops anything that is not a plain http(s) base.
    LINKS = mergeLinks(DEFAULT_LINKS, await res.json());
    $('phoenixLink').href = LINKS.phoenix_url;
    $('grafanaLink').href = LINKS.grafana_url;
  } catch (err) {
    // Links are optional: keep the static defaults if /links is unreachable.
  }
}

function externalLink(href, label, onClick) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = label;
  a.target = '_blank';
  a.rel = 'noopener';
  a.onclick = onClick;
  return a;
}

function headers() {
  const t = $('token').value.trim();
  const h = {};
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

async function api(path) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(res.status + ' ' + path + ' — ' + text.slice(0, 200));
  }
  return res.json();
}

function textSpan(text, className) {
  const span = document.createElement('span');
  span.className = className;
  span.textContent = text;
  return span;
}

function setError(target, err) {
  $(target).replaceChildren(textSpan(String(err.message || err), 'bad'));
}

function statusPillEl(status) {
  const { status: label, className } = statusPill(status);
  return textSpan(label, className);
}

function addTextCells(tr, values) {
  for (const value of values) {
    const td = document.createElement('td');
    td.textContent = value;
    tr.appendChild(td);
  }
}

/** A full-width dim "none"/"empty" row, built without markup. */
function emptyRow(tbody, cols, label) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = cols;
  td.className = 'muted';
  td.textContent = label;
  tr.appendChild(td);
  tbody.appendChild(tr);
}

async function loadDocuments() {
  const status = $('statusFilter').value;
  const q = status ? ('?status=' + encodeURIComponent(status)) : '';
  const body = await api('/v1/documents' + q);
  const tb = $('documents').querySelector('tbody');
  tb.replaceChildren();
  for (const d of body.documents || []) {
    const tr = document.createElement('tr');
    tr.className = 'clickable';
    addTextCells(tr, [d.doc_id || '', d.filename || '', d.doc_type || '—']);
    const statusCell = document.createElement('td');
    statusCell.appendChild(statusPillEl(d.status));
    tr.appendChild(statusCell);
    tr.onclick = () => selectDocument(d.doc_id);
    tb.appendChild(tr);
  }
  if (!tb.children.length) emptyRow(tb, 4, 'none');
}

async function loadReview() {
  const body = await api('/v1/documents?status=parked');
  const tb = $('review').querySelector('tbody');
  tb.replaceChildren();
  for (const d of body.documents || []) {
    const tr = document.createElement('tr');
    tr.className = 'clickable';
    addTextCells(tr, [d.doc_id || '', d.filename || '', d.doc_type || '—']);
    tr.onclick = () => selectDocument(d.doc_id);
    tb.appendChild(tr);
  }
  if (!tb.children.length) emptyRow(tb, 3, 'empty');
}

async function loadRuns() {
  const body = await api('/v1/runs');
  const tb = $('runs').querySelector('tbody');
  tb.replaceChildren();
  for (const r of body.runs || []) {
    const tr = document.createElement('tr');
    tr.className = 'clickable';
    addTextCells(tr, [r.run_id, r.documents ?? '—']);
    const links = runLinks(LINKS, r.run_id);
    const replayCell = document.createElement('td');
    const replay = document.createElement('a');
    replay.href = links.replay;
    replay.textContent = 'replay ↗';
    replay.onclick = (ev) => ev.stopPropagation();
    replayCell.appendChild(replay);
    tr.appendChild(replayCell);
    const grafanaCell = document.createElement('td');
    grafanaCell.appendChild(
      externalLink(links.grafana, 'grafana ↗', (ev) => ev.stopPropagation())
    );
    tr.appendChild(grafanaCell);
    const phoenixCell = document.createElement('td');
    phoenixCell.appendChild(
      externalLink(links.phoenix, 'phoenix ↗', (ev) => ev.stopPropagation())
    );
    tr.appendChild(phoenixCell);
    tr.onclick = () => loadCards(r.run_id);
    tb.appendChild(tr);
  }
  if (!tb.children.length) emptyRow(tb, 5, 'no eval runs yet');
}

async function loadCards(runId) {
  try {
    const body = await api('/v1/runs/' + encodeURIComponent(runId) + '/cards');
    $('cards').classList.remove('muted');
    $('cards').textContent = JSON.stringify(body.cards, null, 2) || '[]';
    if (!body.cards || !body.cards.length) {
      $('cards').textContent = 'no cards yet for ' + runId;
      $('cards').classList.add('muted');
    }
  } catch (err) { setError('cards', err); }
}

async function selectDocument(docId) {
  $('auditDocId').value = docId;
  try {
    const body = await api('/v1/documents/' + encodeURIComponent(docId));
    $('detail').classList.remove('muted');
    $('detail').textContent = JSON.stringify(body, null, 2);
  } catch (err) { setError('detail', err); }
}

async function verifyAudit() {
  const docId = $('auditDocId').value.trim();
  if (!docId) return;
  try {
    const body = await api('/v1/audit/' + encodeURIComponent(docId));
    const { text, className, entries } = auditSummary(body.chain, (body.entries || []).length);
    $('auditResult').replaceChildren(
      textSpan(text, className),
      document.createTextNode(' · ' + entries + ' entries')
    );
  } catch (err) { setError('auditResult', err); }
}

async function refresh() {
  try { await loadLinks(); } catch (err) { /* static defaults are fine */ }
  try { await loadDocuments(); } catch (err) { setError('documents', err); }
  try { await loadReview(); } catch (err) { setError('review', err); }
  try { await loadRuns(); } catch (err) { setError('runs', err); }
}

$('refresh').onclick = refresh;
$('statusFilter').onchange = () => loadDocuments().catch((e) => setError('documents', e));
$('auditGo').onclick = verifyAudit;
$('token').oninput = refresh;
refresh();
</script>
</body>
</html>
