<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mailroom · runs UI</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --muted:#9aa4b2; --accent:#5b9dff; --ok:#3fb950; --bad:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); }
    header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    header h1 { font-size:16px; margin:0 16px 0 0; }
    header a { color:var(--accent); text-decoration:none; }
    header a:hover { text-decoration:underline; }
    .grow { flex:1; }
    input { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
    button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    main { padding:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
    section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
    th { color:var(--muted); font-weight:500; }
    tr.clickable:hover { background:#1d222c; cursor:pointer; }
    .pill { display:inline-block; padding:1px 7px; border-radius:999px; border:1px solid var(--line); font-size:11px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
    pre { background:#0b0d11; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:11px; max-height:280px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
    .warn { color:#d29922; }
  </style>
</head>
<body>
  <header>
    <h1>mailroom · runs UI</h1>
    <a href="/tui">tui ↗</a>
    <a id="phoenixLink" href="http://localhost:6006" target="_blank" rel="noopener">Phoenix :6006</a>
    <a id="grafanaLink" href="http://localhost:3000" target="_blank" rel="noopener">Grafana :3000</a>
    <span class="grow"></span>
    <input id="token" type="password" placeholder="API token (if set)" autocomplete="off" />
    <button id="refresh">refresh</button>
  </header>

  <main>
    <section>
      <h2>Documents</h2>
      <div class="row">
        <select id="statusFilter">
          <option value="">all statuses</option>
          <option>processing</option>
          <option>parked</option>
          <option>archived</option>
          <option>failed</option>
        </select>
      </div>
      <table id="documents"><thead><tr><th>doc_id</th><th>filename</th><th>type</th><th>status</th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Review queue</h2>
      <table id="review"><thead><tr><th>doc_id</th><th>filename</th><th>type</th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>Audit verify</h2>
      <p class="muted" id="auditHint">Click a document row, or enter a doc_id.</p>
      <div class="row"><input id="auditDocId" placeholder="doc_id" /><button id="auditGo">verify</button></div>
      <div id="auditResult" class="muted">—</div>
    </section>

    <section>
      <h2>Eval runs</h2>
      <table id="runs"><thead><tr><th>run_id</th><th>documents</th><th>replay</th><th>grafana</th><th>phoenix</th></tr></thead><tbody></tbody></table>
      <h2 style="margin-top:14px">Cards</h2>
      <pre id="cards" class="muted">run not selected</pre>
    </section>

    <section>
      <h2>Document detail</h2>
      <pre id="detail" class="muted">no document selected</pre>
    </section>
  </main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // Observability base URLs. The static defaults match the header's initial
  // hrefs; loadLinks() replaces them from the public GET /links.
  const LINKS = {
    public_url: "http://localhost:8000",
    phoenix_url: "http://localhost:6006",
    grafana_url: "http://localhost:3000",
    phoenix_project: "mailroom-live",
  };

  async function loadLinks() {
    try {
      const res = await fetch("/links", { headers: { Accept: "application/json" } });
      if (!res.ok) return;
      const body = await res.json();
      for (const key of ["public_url", "phoenix_url", "grafana_url", "phoenix_project"]) {
        if (typeof body[key] === "string" && body[key]) LINKS[key] = body[key];
      }
      $("phoenixLink").href = LINKS.phoenix_url;
      $("grafanaLink").href = LINKS.grafana_url;
    } catch (err) {
      // Links are optional: keep the static defaults if /links is unreachable.
    }
  }

  function externalLink(href, label, onClick) {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = label;
    a.target = "_blank";
    a.rel = "noopener";
    a.onclick = onClick;
    return a;
  }

  function headers() {
    const t = $("token").value.trim();
    const h = {};
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }

  async function api(path) {
    const res = await fetch(path, { headers: headers() });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(res.status + " " + path + " — " + text.slice(0, 200));
    }
    return res.json();
  }

  function textSpan(text, className) {
    const span = document.createElement("span");
    span.className = className;
    span.textContent = text;
    return span;
  }

  function setError(target, err) {
    $(target).replaceChildren(textSpan(String(err.message || err), "bad"));
  }

  function statusPill(s) {
    const status = ["processing", "parked", "archived", "failed"].includes(s) ? s : "?";
    const cls = status === "archived" ? "ok" : (status === "failed" ? "bad" : "muted");
    return textSpan(status, "pill " + cls);
  }

  function addTextCells(tr, values) {
    for (const value of values) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
  }

  async function loadDocuments() {
    const status = $("statusFilter").value;
    const q = status ? ("?status=" + encodeURIComponent(status)) : "";
    const body = await api("/v1/documents" + q);
    const tb = $("documents").querySelector("tbody");
    tb.innerHTML = "";
    for (const d of body.documents || []) {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      addTextCells(tr, [d.doc_id || "", d.filename || "", d.doc_type || "—"]);
      const statusCell = document.createElement("td");
      statusCell.appendChild(statusPill(d.status));
      tr.appendChild(statusCell);
      tr.onclick = () => selectDocument(d.doc_id);
      tb.appendChild(tr);
    }
    if (!tb.children.length) tb.innerHTML = '<tr><td colspan="4" class="muted">none</td></tr>';
  }

  async function loadReview() {
    const body = await api("/v1/documents?status=parked");
    const tb = $("review").querySelector("tbody");
    tb.innerHTML = "";
    for (const d of body.documents || []) {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      addTextCells(tr, [d.doc_id || "", d.filename || "", d.doc_type || "—"]);
      tr.onclick = () => selectDocument(d.doc_id);
      tb.appendChild(tr);
    }
    if (!tb.children.length) tb.innerHTML = '<tr><td colspan="3" class="muted">empty</td></tr>';
  }

  async function loadRuns() {
    const body = await api("/v1/runs");
    const tb = $("runs").querySelector("tbody");
    tb.innerHTML = "";
    for (const r of body.runs || []) {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      addTextCells(tr, [r.run_id, r.documents ?? "—"]);
      const replayCell = document.createElement("td");
      const replay = document.createElement("a");
      replay.href = "/tui#replay=run:" + encodeURIComponent(r.run_id);
      replay.textContent = "replay ↗";
      replay.onclick = (ev) => ev.stopPropagation();
      replayCell.appendChild(replay);
      tr.appendChild(replayCell);
      const grafanaCell = document.createElement("td");
      grafanaCell.appendChild(
        externalLink(
          `${LINKS.grafana_url}/d/mailroom-quality?var-run_id=${encodeURIComponent(r.run_id)}`,
          "grafana ↗",
          (ev) => ev.stopPropagation()
        )
      );
      tr.appendChild(grafanaCell);
      const phoenixCell = document.createElement("td");
      phoenixCell.appendChild(
        externalLink(LINKS.phoenix_url, "phoenix ↗", (ev) => ev.stopPropagation())
      );
      tr.appendChild(phoenixCell);
      tr.onclick = () => loadCards(r.run_id);
      tb.appendChild(tr);
    }
    if (!tb.children.length) tb.innerHTML = '<tr><td colspan="5" class="muted">no eval runs yet</td></tr>';
  }

  async function loadCards(runId) {
    try {
      const body = await api("/v1/runs/" + encodeURIComponent(runId) + "/cards");
      $("cards").classList.remove("muted");
      $("cards").textContent = JSON.stringify(body.cards, null, 2) || "[]";
      if (!body.cards || !body.cards.length) {
        $("cards").textContent = "no cards yet for " + runId + " (Task 21)";
        $("cards").classList.add("muted");
      }
    } catch (err) { setError("cards", err); }
  }

  async function selectDocument(docId) {
    $("auditDocId").value = docId;
    try {
      const body = await api("/v1/documents/" + encodeURIComponent(docId));
      $("detail").classList.remove("muted");
      $("detail").textContent = JSON.stringify(body, null, 2);
    } catch (err) { setError("detail", err); }
  }

  async function verifyAudit() {
    const docId = $("auditDocId").value.trim();
    if (!docId) return;
    try {
      const body = await api("/v1/audit/" + encodeURIComponent(docId));
      const ok = body.chain && body.chain.ok;
      const summary = ok ? "chain OK" : "chain BROKEN at " + (body.chain && body.chain.broken_at);
      $("auditResult").replaceChildren(
        textSpan(summary, ok ? "ok" : "bad"),
        document.createTextNode(" · " + (body.entries || []).length + " entries")
      );
    } catch (err) { setError("auditResult", err); }
  }

  async function refresh() {
    try { await loadLinks(); } catch (err) { /* static defaults are fine */ }
    try { await loadDocuments(); } catch (err) { setError("documents", err); }
    try { await loadReview(); } catch (err) { setError("review", err); }
    try { await loadRuns(); } catch (err) { setError("runs", err); }
  }

  $("refresh").onclick = refresh;
  $("statusFilter").onchange = () => loadDocuments().catch((e) => setError("documents", e));
  $("auditGo").onclick = verifyAudit;
  $("token").oninput = refresh;
  refresh();
})();
</script>
</body>
</html>
