<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mailroom — tui</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/tui/assets/tokens.css">
  <link rel="stylesheet" href="/tui/assets/tui.css">
</head>
<body>
  <!-- The page h1 sits inside the header so it stays within a landmark (and out of
       #output, which the scrollback trimmer and `clear` empty). Visually hidden. -->
  <header class="status-bar"><h1 class="sr-only">mailroom terminal</h1></header>
  <div class="ambient-skyline" aria-hidden="true"></div>
  <!-- tabindex: the scrollback scrolls, so keyboard users must be able to focus and
       scroll it (axe scrollable-region-focusable); it holds no focusable content. -->
  <main id="output" class="terminal" aria-live="polite" tabindex="0"></main>
  <!-- role=form: the command line is a landmark, so its prompt and input are not
       page content outside one. The class is unchanged for terminal.js. -->
  <div class="prompt-line" role="form" aria-label="terminal command"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="crt-overlay" aria-hidden="true"></div>
  <noscript><p class="line">tui needs javascript — the runs page works without it: <a href="/ui">/ui</a></p></noscript>
  <script type="module" src="/tui/assets/main.js"></script>
</body>
</html>
