# OTLP in; traces -> Phoenix; metrics -> Prometheus exporter :8889.
# Scrapes vLLM, DCGM, and (optionally) a remote vLLM /metrics endpoint.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["vllm:8001"]
        - job_name: dcgm-exporter
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["dcgm-exporter:9400"]
        # VLLM_METRICS_URLS / VLLM_METRICS_SCHEME: ONE extra host[:port] (e.g. a
        # Modal vLLM deployment, scheme https). The Collector cannot expand an
        # env var into a target list; for several remote endpoints add jobs here.
        # The default points at the Collector's own metrics so the job is inert.
        - job_name: vllm-remote
          scrape_interval: 15s
          metrics_path: /metrics
          scheme: ${env:VLLM_METRICS_SCHEME}
          static_configs:
            - targets: ["${env:VLLM_METRICS_URLS}"]

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s

processors:
  batch: {}

exporters:
  otlphttp/phoenix:
    traces_endpoint: http://phoenix:6006/v1/traces
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp, prometheus, docker_stats]
      processors: [batch]
      exporters: [prometheus]
