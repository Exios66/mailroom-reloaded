global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Everything (app metrics, vLLM, DCGM, docker_stats) reaches Prometheus
  # through the Collector's prometheus exporter.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
