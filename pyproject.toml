[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailroom-reloaded"
version = "0.2.0"
description = "Compressed Digital Mailroom on CrewAI Flows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai>=1.8,<2",
    "openai",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "structlog",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pypdf",
    "pdfplumber",
    "pymupdf",
    "python-docx",
    "reportlab",
    "watchdog",
    "httpx",
    "python-dateutil",
    "jellyfish",
    "numpy",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "openinference-instrumentation-crewai",
    "openinference-instrumentation-openai",
]

[project.optional-dependencies]
bert = ["mailroom-ml[serve] @ git+https://github.com/LLM-Mailroom-Services/mailroom-ml.git"]
eval = ["datasets", "pandas", "matplotlib"]
gmail = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
embeddings = ["scipy", "sentence-transformers"]
deploy = ["modal==1.5.5"]
dev = ["pytest", "pytest-asyncio", "respx", "scikit-learn", "ruff"]
sandbox = ["jsonschema>=4", "zstandard", "jinja2"]
anchor = ["psycopg[binary]"]
parity = ["llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.21.0"]

[project.scripts]
mailroom = "mailroom_reloaded.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_reloaded"]
# YAML/JSON/text data under the package ships in the wheel (hatchling includes all files in packages).

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "mailroom_reloaded/sandbox/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: end-to-end tests that need a running dev server or live provider (deselected by default)",
]

[tool.ruff]
# Vendored verbatim from llm-dojo-scoring v0.21.0 (see scoring/PARITY.md); keep upstream bytes.
extend-exclude = [
  "src/mailroom_reloaded/scoring/classification.py",
  "src/mailroom_reloaded/scoring/config.py",
  "src/mailroom_reloaded/scoring/corpus.py",
  "src/mailroom_reloaded/scoring/equivalences.py",
  "src/mailroom_reloaded/scoring/extraction_metrics.py",
  "src/mailroom_reloaded/scoring/field_scoring.py",
  "src/mailroom_reloaded/scoring/gt_metadata.py",
  "src/mailroom_reloaded/scoring/intake.py",
  "src/mailroom_reloaded/scoring/intents.py",
  "src/mailroom_reloaded/scoring/maud.py",
  "src/mailroom_reloaded/scoring/trace_knobs.py",
]
